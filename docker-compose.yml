services:
  postgres:
    image: postgres:18.6-alpine
    container_name: remote-code-postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-remote_code}

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    container_name: remote-code-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.5-alpine
    container_name: remote-code-rabbitmq
    restart: unless-stopped

    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  remote-code:
    build:
      context: .
      dockerfile: Dockerfile
    image: remote-code:latest
    container_name: remote-code
    restart: unless-stopped

    ports:
      - "127.0.0.1:${HTTP_PORT:-8000}:8000"
      - "127.0.0.1:${METRICS_PORT:-9100}:9100"

    environment:
      HTTP_ADDR: ":8000"
      SHUTDOWN_TIMEOUT: "10s"
      METRICS_ADDR: ":9100"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-remote_code}?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    user: "65532:65532"

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    mem_reservation: 128m
    cpus: "1.0"

  processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    image: remote-code-processor:latest
    container_name: remote-code-processor
    restart: unless-stopped

    ports:
      - "127.0.0.1:${PROCESSOR_METRICS_PORT:-9101}:9100"

    environment:
      METRICS_ADDR: ":9100"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-remote_code}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      PHILHARMONIC_URL: ${PHILHARMONIC_URL:-http://localhost:5555}
      PHILHARMONIC_TOKEN: ${PHILHARMONIC_TOKEN:-}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # the server owns the migrations, the processor already waits for db readiness
      remote-code:
        condition: service_started

    user: "65532:65532"

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    mem_reservation: 128m
    cpus: "1.0"

volumes:
  postgres-data:
